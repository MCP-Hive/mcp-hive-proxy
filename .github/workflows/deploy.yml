name: Build and Deploy to ECS

on:
    push:
        branches: [main]

env:
    AWS_REGION: us-east-1
    ECR_REPO_STAGING: mcp-proxy-staging
    ECR_REPO_PROD: mcp-proxy-prod

permissions:
    id-token: write
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                environment: [staging, prod]
        environment: ${{ matrix.environment }}

        steps:
            - uses: actions/checkout@v4

            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag, and push image
              env:
                  REGISTRY: ${{ steps.ecr-login.outputs.registry }}
                  REPOSITORY: ${{ matrix.environment == 'prod' && env.ECR_REPO_PROD || env.ECR_REPO_STAGING }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
                  docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
                  docker push $REGISTRY/$REPOSITORY:latest

            - name: Deploy to ECS
              env:
                  CLUSTER_NAME: mcp-hive-${{ matrix.environment }}
                  SERVICE_NAME: mcp-proxy-${{ matrix.environment }}
              run: |
                  aws ecs update-service \
                      --cluster "$CLUSTER_NAME" \
                      --service "$SERVICE_NAME" \
                      --force-new-deployment \
                      --no-cli-pager --query 'service.serviceName' --output text
                  aws ecs wait services-stable \
                      --cluster "$CLUSTER_NAME" \
                      --services "$SERVICE_NAME"
